name: packwise_flutter
description: A new Flutter standalone app for Voyage Genie.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  google_fonts: ^6.1.0
  go_router: ^12.1.1
  http: ^1.1.2
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^7.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_dark.png"
  min_sdk_android: 21
  adaptive_icon_background: "#030712"
  adaptive_icon_foreground: "assets/icon_dark.png"

flutter_native_splash:
  color: "#030712"
  image: "assets/icon_dark.png"
  android: true
  ios: true
  android_12:
    color: "#030712"
    image: "assets/icon_dark.png"

